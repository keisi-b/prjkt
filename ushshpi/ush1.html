<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shuma e 2 numrave</title>
</head>
<body>
    <h2 id="totali">shuma e dy numrave</h2>

    <script>
        let nr1 = Number(prompt("vendos numrin e pare: "))
        let nr2 = Number(prompt("vendos numrin e dyte: "))

        let totali = nr1+nr2;
        document.getElementById("totali").innerHTML=
        "shuma e dy numrave eshte :" +" "+totali;
    </script>
</body>
</html>
